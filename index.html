<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="weather-card">
      <div class="search-box">
        <div class="input-box">
          <span>⌖</span>
          <input type="text" id="cityInput" placeholder="Enter city" />
        </div>

        <button id="searchBtn">⌕</button>
      </div>

      <div class="weather-main">
        <div class="temperature">
          <span id="temperature">22</span>
          <span class="degree">°C</span>
        </div>

        <h2 id="city">CITY</h2>

        <p class="condition">
          <span id="condition">CLEAR SKY</span>
        </p>

        <p class="location">• Feels like <span id="feelsLike">23°C</span></p>
      </div>

      <div class="divider"></div>

      <div class="details">
        <div class="detail-box">
          <div class="detail-icon">≋</div>

          <div>
            <p>HUMIDITY</p>
            <h3 id="humidity">53%</h3>
            <span class="status">Optimal</span>
          </div>
        </div>

        <div class="detail-box">
          <div class="detail-icon">≋</div>

          <div>
            <p>WIND SPEED</p>
            <h3 id="wind">5.66 <small>km/h</small></h3>
          </div>
        </div>
      </div>

      <div class="bottom-info">
        <p class="updated">Updated 2m ago</p>
      </div>
    </div>
    <script>
      const apiKey = "API_KEY";
      const cityInput = document.querySelector("#cityInput");
      const searchBtn = document.querySelector("#searchBtn");
      async function weatherIndicator() {
        const city = cityInput.value;
        const apiURL = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;
        let response = await fetch(apiURL);
        const data = await response.json();
        console.log(data);
        if (data.cod !== 200) {
          document.getElementById("city").textContent = "NO SUCH CITY EXISTS";
          document.getElementById("city").style.color = "red";
          return;
        }
        document.getElementById("temperature").textContent = Math.round(
          data.main.temp,
        );
        document.getElementById("city").textContent = data.name;
        document.getElementById("condition").textContent =
          data.weather[0].description;
        document.getElementById("feelsLike").textContent =
          Math.round(data.main.feels_like) + "°C";
        document.getElementById("humidity").textContent =
          data.main.humidity + "%";
        document.getElementById("wind").innerHTML =
          `${(data.wind.speed * 3.6).toFixed(2)} <small>km/h</small>`;
        cityInput.value = "";
      }

      searchBtn.addEventListener("click", weatherIndicator);

      cityInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          weatherIndicator();
        }
      });
    </script>
  </body>
</html>
